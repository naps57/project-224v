[project]
name = "smt-trial-matching"
version = "0.1.0"
description = "Conversational clinical-trial matching with SMT state (CS224V)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "z3-solver>=4.12",
    "scikit-learn>=1.9.1",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smt_trial_matching", "smtstate"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The CA's code is imported, never edited (project rule), so it is not linted.
extend-exclude = ["smtstate", "baselines", "eval", "data"]
